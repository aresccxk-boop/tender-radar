name: 更新招标数据

on:
  schedule:
    # 北京时间 07:30 和 13:30（中国无夏令时，对应 UTC 23:30 与 05:30）
    - cron: "30 23 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-tenders
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取公开公告
        env:
          FETCH_RUNNER: github-actions
        run: python scripts/fetch.py
      - name: 提交 data/tenders.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "chore: 更新招标数据"
            git push
          fi
