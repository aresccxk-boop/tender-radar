<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共时招标雷达</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>共时招标雷达</h1>
      <p id="updated">正在读取数据…</p>
    </div>
  </div>
  <button type="button" class="ghost mobile-only" id="open-filter">筛选</button>
  <div class="sources" id="sources"></div>
</header>

<div class="layout">
  <aside class="side" id="side">
    <div class="side-head mobile-only">
      <strong>筛选</strong>
      <button type="button" class="ghost" id="close-filter">关闭</button>
    </div>
    <label class="search">
      <span class="sr">搜索</span>
      <input id="q" type="search" placeholder="搜索标题、单位、供应商" autocomplete="off">
    </label>

    <section class="block">
      <h2>常用视图</h2>
      <div class="views" id="views"></div>
    </section>

    <section class="block">
      <h2>产品线</h2>
      <div class="checks" id="f-line"></div>
    </section>
    <section class="block">
      <h2>地区</h2>
      <div class="checks" id="f-region"></div>
      <p class="hint">河南地市</p>
      <div class="checks cities" id="f-city"></div>
    </section>
    <section class="block">
      <h2>学段</h2>
      <div class="checks" id="f-stage"></div>
    </section>
    <section class="block">
      <h2>公告类型</h2>
      <div class="checks" id="f-ntype"></div>
    </section>
    <section class="block">
      <h2>预算</h2>
      <div class="checks" id="f-budget"></div>
    </section>
    <section class="block">
      <h2>截止日期</h2>
      <div class="checks" id="f-due"></div>
    </section>
    <section class="block">
      <h2>发布日期</h2>
      <div class="checks" id="f-pub"></div>
    </section>
    <button type="button" class="text-btn" id="clear">清空筛选</button>
    <p class="side-foot">深圳共时科技 · 数字员工团队出品</p>
  </aside>
  <div class="mask" id="mask"></div>

  <main>
    <div class="toolbar">
      <div class="stats">
        <strong id="count">0</strong> 条
        <span id="sum"></span>
        <span id="picked"></span>
      </div>
      <div class="tools">
        <button type="button" id="copy-link">复制链接</button>
        <button type="button" id="copy-text">复制摘要</button>
        <button type="button" id="export-xls">导出 Excel</button>
        <button type="button" id="export-csv">导出 CSV</button>
        <button type="button" id="print">打印 / PDF</button>
      </div>
    </div>
    <p class="legend">截止日期：<i class="dot urgent"></i>3 天内 <i class="dot soon"></i>7 天内 <i class="dot over"></i>已截止。点表头可按发布日、截止日、预算排序。勾选后可生成企业微信文字摘要。</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="ck"><input type="checkbox" id="check-page" aria-label="勾选本页"></th>
            <th>标题</th>
            <th>地区</th>
            <th>产品线</th>
            <th>学段</th>
            <th>类型</th>
            <th>采购单位</th>
            <th class="num sortable" data-sort="budget">预算</th>
            <th class="sortable" data-sort="publish">发布</th>
            <th class="sortable" data-sort="deadline">截止</th>
            <th>来源</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <button type="button" id="prev">上一页</button>
      <span id="page-label"></span>
      <button type="button" id="next">下一页</button>
      <label>每页
        <select id="ps">
          <option value="30">30</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </label>
      <button type="button" class="text-btn" id="select-all">全选筛选结果</button>
      <button type="button" class="text-btn" id="select-none">取消勾选</button>
    </div>
    <footer>深圳共时科技 · 数字员工团队出品</footer>
  </main>
</div>

<div id="toast" role="status"></div>
<script src="assets/app.js"></script>
</body>
</html>
